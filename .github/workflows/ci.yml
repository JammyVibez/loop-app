name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Install + typecheck + the unit suite. The previous 5 minutes was sized for
    # a bare `tsc`; this job now also runs the tests.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Same command as local (`npm run verify`) so CI and a developer's
      # machine cannot drift. The unit suite was previously never run in CI.
      - run: npm run verify

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          # Auth is imported while Next.js collects route/page metadata. These
          # disposable build-only values satisfy fail-fast configuration checks;
          # no build step opens a database connection or uses real credentials.
          DATABASE_URL: postgresql://loop:ci-only@127.0.0.1:5432/loop
          BETTER_AUTH_SECRET: loop-ci-build-only-secret-do-not-use-at-runtime-123456
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

      - name: Install pinned Chromium smoke-test runner
        run: npm install --no-save --no-package-lock --ignore-scripts --legacy-peer-deps playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production build for viewport checks
        run: |
          npm run start > /tmp/loop-next.log 2>&1 &
          echo "$!" > /tmp/loop-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/terms > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/loop-next.log
          exit 1
        env:
          DATABASE_URL: postgresql://loop:ci-only@127.0.0.1:5432/loop
          BETTER_AUTH_SECRET: loop-ci-build-only-secret-do-not-use-at-runtime-123456
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Run mobile, tablet and desktop viewport acceptance
        run: node scripts/responsive-browser-smoke.mjs
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-responsive-browser-screenshots
          path: artifacts/responsive/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This VPS also deploys itself on a systemd timer, so the SSH path is
      # optional: without the secrets the job reports a skip instead of a
      # failed workflow.
      - name: Check for deployment credentials
        id: credentials
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST secret is not set - skipping the SSH deploy."
          fi

      - name: Update and restart production app
        if: steps.credentials.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR
          script: |
            set -e
            # Channels runs against a loopback-only UltraSrc service. Its URL and
            # key live in this root-owned file so `pm2 restart --update-env`
            # keeps them without storing secrets in the repository.
            if [ -f /etc/loop/ultrasrc.conf ]; then set -a; . /etc/loop/ultrasrc.conf; set +a; fi
            cd "${APP_DIR:-/var/loop}"
            git pull --ff-only origin main
            npm ci --legacy-peer-deps
            npm run build
            if pm2 describe loop-app >/dev/null 2>&1; then
              pm2 restart loop-app --update-env
            else
              pm2 start ecosystem.config.js --only loop-app
            fi
            pm2 save
