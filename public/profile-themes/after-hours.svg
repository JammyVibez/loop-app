<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Neon after hours city artwork">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030f"/>
      <stop offset="0.42" stop-color="#120a2b"/>
      <stop offset="0.7" stop-color="#3a0d33"/>
      <stop offset="1" stop-color="#12050f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e63"/>
      <stop offset="0.5" stop-color="#ff6f91"/>
      <stop offset="1" stop-color="#5b8dff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f34" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0512"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2c0" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ff3a6e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3a6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="trace" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1120" cy="330" rx="420" ry="300" fill="url(#sun)" filter="url(#blur)"/>

  <!-- Retro sun with slats -->
  <circle cx="1120" cy="330" r="150" fill="#ff4d73" opacity="0.5"/>
  <g stroke="#1a0616" stroke-width="10" opacity="0.7">
    <line x1="960" y1="290" x2="1280" y2="290"/>
    <line x1="960" y1="320" x2="1280" y2="320"/>
    <line x1="966" y1="352" x2="1274" y2="352"/>
    <line x1="980" y1="386" x2="1260" y2="386"/>
    <line x1="1000" y1="420" x2="1240" y2="420"/>
    <line x1="1030" y1="452" x2="1210" y2="452"/>
  </g>

  <!-- Skyline, back layer -->
  <g fill="#150a24">
    <rect x="40" y="470" width="110" height="260"/>
    <rect x="170" y="420" width="80" height="310"/>
    <rect x="270" y="500" width="130" height="230"/>
    <rect x="420" y="380" width="70" height="350"/>
    <rect x="510" y="460" width="120" height="270"/>
    <rect x="650" y="430" width="90" height="300"/>
    <rect x="760" y="500" width="140" height="230"/>
    <rect x="920" y="440" width="80" height="290"/>
    <rect x="1020" y="490" width="130" height="240"/>
    <rect x="1170" y="410" width="90" height="320"/>
    <rect x="1280" y="470" width="120" height="260"/>
    <rect x="1420" y="430" width="140" height="300"/>
  </g>

  <!-- Skyline, front layer -->
  <g fill="#0a0414">
    <rect x="0" y="560" width="190" height="340"/>
    <rect x="200" y="620" width="150" height="280"/>
    <rect x="360" y="540" width="120" height="360"/>
    <rect x="500" y="650" width="180" height="250"/>
    <rect x="700" y="580" width="150" height="320"/>
    <rect x="870" y="640" width="170" height="260"/>
    <rect x="1060" y="560" width="140" height="340"/>
    <rect x="1220" y="620" width="180" height="280"/>
    <rect x="1420" y="540" width="180" height="360"/>
  </g>

  <!-- Lit windows -->
  <g fill="#ffb2c8" opacity="0.75">
    <rect x="66" y="500" width="12" height="16"/><rect x="96" y="500" width="12" height="16"/>
    <rect x="66" y="540" width="12" height="16"/><rect x="116" y="580" width="12" height="16"/>
    <rect x="192" y="450" width="10" height="14"/><rect x="216" y="490" width="10" height="14"/>
    <rect x="192" y="530" width="10" height="14"/>
    <rect x="438" y="410" width="10" height="14"/><rect x="462" y="450" width="10" height="14"/>
    <rect x="438" y="490" width="10" height="14"/>
    <rect x="676" y="470" width="10" height="14"/><rect x="700" y="510" width="10" height="14"/>
    <rect x="1188" y="450" width="10" height="14"/><rect x="1212" y="490" width="10" height="14"/>
    <rect x="1188" y="530" width="10" height="14"/>
  </g>
  <g fill="#7fd4ff" opacity="0.6">
    <rect x="290" y="530" width="10" height="14"/><rect x="320" y="570" width="10" height="14"/>
    <rect x="530" y="490" width="10" height="14"/><rect x="560" y="530" width="10" height="14"/>
    <rect x="790" y="530" width="10" height="14"/><rect x="820" y="570" width="10" height="14"/>
    <rect x="1050" y="520" width="10" height="14"/><rect x="1080" y="560" width="10" height="14"/>
    <rect x="1310" y="500" width="10" height="14"/><rect x="1340" y="540" width="10" height="14"/>
  </g>

  <!-- Neon horizon and street -->
  <rect x="0" y="640" width="1600" height="4" fill="url(#neon)" opacity="0.9" filter="url(#trace)"/>
  <rect x="0" y="648" width="1600" height="252" fill="url(#road)"/>
  <g stroke="#ff4d79" stroke-width="2" opacity="0.55">
    <path d="M800 660 L420 900"/>
    <path d="M800 660 L1180 900"/>
    <path d="M800 660 L700 900"/>
    <path d="M800 660 L900 900"/>
  </g>
  <g stroke="#6ea8ff" stroke-width="1.2" opacity="0.3">
    <path d="M0 700 L1600 700"/><path d="M0 760 L1600 760"/><path d="M0 830 L1600 830"/>
  </g>

  <!-- Rain streaks -->
  <g stroke="#ffd7e4" stroke-width="1.2" opacity="0.18">
    <line x1="180" y1="80" x2="140" y2="260"/>
    <line x1="360" y1="60" x2="320" y2="240"/>
    <line x1="560" y1="120" x2="520" y2="300"/>
    <line x1="900" y1="70" x2="860" y2="250"/>
    <line x1="1360" y1="90" x2="1320" y2="270"/>
    <line x1="1480" y1="140" x2="1440" y2="320"/>
  </g>

  <rect width="1600" height="900" fill="#04010a" opacity="0.14"/>
</svg>
