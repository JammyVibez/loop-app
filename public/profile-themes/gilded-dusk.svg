<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gilded dusk abstract artwork">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0812"/>
      <stop offset="0.38" stop-color="#151020"/>
      <stop offset="0.68" stop-color="#241726"/>
      <stop offset="1" stop-color="#321d24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#f6e3b6" stop-opacity="0.72"/>
      <stop offset="0.22" stop-color="#e8c98b" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#c98f7a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c98f7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.16" cy="0.86" r="0.58">
      <stop offset="0" stop-color="#7a5a9e" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#573b74" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#573b74" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.42" cy="1.04" r="0.55">
      <stop offset="0" stop-color="#c98f7a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c98f7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c98b" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#f4e2b6" stop-opacity="0.65"/>
      <stop offset="0.62" stop-color="#e8c98b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c98f7a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0812" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#0b0812" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0b0812" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="blur28" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <rect width="1600" height="900" fill="url(#violet)"/>
  <rect width="1600" height="900" fill="url(#ember)"/>

  <g filter="url(#blur28)" opacity="0.55">
    <ellipse cx="1180" cy="196" rx="150" ry="150" fill="#f6e3b6" opacity="0.5"/>
    <ellipse cx="1268" cy="156" rx="66" ry="66" fill="#fdf1d4" opacity="0.6"/>
  </g>

  <g fill="none" stroke="url(#gold)" filter="url(#blur8)">
    <ellipse cx="800" cy="980" rx="1120" ry="520" stroke-width="1.4" opacity="0.55"/>
    <ellipse cx="800" cy="1000" rx="900" ry="430" stroke-width="1" opacity="0.4"/>
    <ellipse cx="800" cy="1020" rx="690" ry="340" stroke-width="0.9" opacity="0.3"/>
  </g>

  <g fill="none" stroke="url(#gold)" opacity="0.22">
    <path d="M-120 640 C 320 470, 700 430, 1080 500 S 1560 520, 1760 420" stroke-width="1"/>
    <path d="M-120 700 C 340 540, 720 500, 1100 560 S 1560 590, 1760 480" stroke-width="0.8"/>
  </g>

  <g fill="#f6e3b6">
    <circle cx="248" cy="172" r="1.7" opacity="0.75"/>
    <circle cx="392" cy="96" r="1.1" opacity="0.5"/>
    <circle cx="520" cy="204" r="1.4" opacity="0.55"/>
    <circle cx="636" cy="120" r="1" opacity="0.4"/>
    <circle cx="884" cy="86" r="1.3" opacity="0.45"/>
    <circle cx="1012" cy="188" r="1.6" opacity="0.5"/>
    <circle cx="1392" cy="300" r="1.2" opacity="0.42"/>
    <circle cx="1468" cy="128" r="1.8" opacity="0.6"/>
    <circle cx="120" cy="332" r="1.1" opacity="0.35"/>
    <circle cx="742" cy="268" r="1" opacity="0.3"/>
    <circle cx="318" cy="420" r="1.2" opacity="0.3"/>
    <circle cx="1520" cy="452" r="1.3" opacity="0.32"/>
  </g>

  <g opacity="0.16" fill="#f7f0e4">
    <circle cx="1180" cy="196" r="3.4"/>
    <circle cx="1240" cy="268" r="2.2"/>
    <circle cx="1108" cy="262" r="1.9"/>
  </g>

  <rect width="1600" height="900" fill="url(#veil)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.5"/>
</svg>
