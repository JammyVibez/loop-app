<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Body/shoulders -->
  <ellipse cx="100" cy="175" rx="55" ry="40" fill="url(#body)"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="40" fill="url(#body)"/>
  <!-- Eyes -->
  <ellipse cx="86" cy="75" rx="5" ry="6" fill="#475569"/>
  <ellipse cx="114" cy="75" rx="5" ry="6" fill="#475569"/>
  <!-- Eye highlights -->
  <circle cx="88" cy="73" r="2" fill="white"/>
  <circle cx="116" cy="73" r="2" fill="white"/>
  <!-- Smile -->
  <path d="M 85 92 Q 100 105 115 92" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="75" cy="88" r="6" fill="#fca5a5" opacity="0.5"/>
  <circle cx="125" cy="88" r="6" fill="#fca5a5" opacity="0.5"/>
</svg>