# Loop — media uploads served by Nginx
#
# Include this inside the `server { }` block that serves loopapp.me. Uploads are
# deliberately NOT served by `next start`: Nginx reads the files straight from
# /var/loop-uploads, adds long-lived immutable cache headers and a locked-down
# content policy, and Cloudflare can cache /media/* in front of it.
#
#   include /etc/nginx/snippets/loop-media.conf;
#
# Then reload: `nginx -t && systemctl reload nginx`.

# Largest upload the app accepts (500MB ceiling). Nginx must not reject what the
# app considers valid; keep this slightly above the policy to allow chunk
# framing. Chunked uploads are 8MB, so this also covers proxies that buffer.
client_max_body_size 520m;

# Stream request bodies straight through to Next instead of spooling a 500MB
# video to /var/lib/nginx/body first.
location ^~ /api/media/upload {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Public media. Filenames are random and never reused, so they can be cached
# forever.
location ^~ /media/ {
    alias /var/loop-uploads/;
    autoindex off;
    try_files $uri =404;

    # Filenames contain only [a-f0-9] and a known extension; anything else
    # (dotfiles, .incoming sources, .private bundles) is never served.
    location ~ /\. {
        deny all;
        return 404;
    }

    # No script ever runs from this path. Nothing executable is stored here —
    # uploads are validated by magic bytes — but a second line of defence costs
    # nothing.
    location ~* \.(php|phtml|phar|cgi|pl|py|sh|bash|exe|dll|so|bat|cmd|jsp|asp|aspx)$ {
        deny all;
        return 404;
    }

    types {
        image/webp                       webp;
        image/avif                       avif;
        image/svg+xml                    svg;
        image/jpeg                       jpg jpeg;
        image/png                        png;
        image/gif                        gif;
        video/mp4                        mp4 m4v;
        video/webm                       webm;
        video/quicktime                  mov;
        video/x-matroska                 mkv;
        video/x-msvideo                  avi;
        audio/mp4                        m4a;
        audio/mpeg                       mp3;
        audio/ogg                        ogg oga;
        audio/wav                        wav;
        audio/flac                       flac;
        audio/aac                        aac;
        application/json                 json;
    }
    default_type application/octet-stream;

    # One year, immutable: safe because a changed image gets a new random name.
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Even a sanitised SVG is served with a policy that forbids script, frames
    # and network access if someone opens the file directly.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header Content-Disposition "inline" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Access-Control-Allow-Origin "*" always;
}
